name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:api
      # `next build` inlines NEXT_PUBLIC_* into the bundle and evaluates each
      # page far enough to decide whether it can be static, so it needs these
      # even though nothing here talks to Supabase. The repo variables hold the
      # hosted project's public values (URL + anon key), both non-secret.
      - run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
